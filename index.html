<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>พอร์ทัลรายวิชา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="frame">
  <div class="topbar"><span id="faculty"></span><span id="year"></span></div>

  <header class="hero">
    <div class="badge" aria-hidden="true"><i id="b1"></i><i id="b2"></i></div>
    <img id="logo" class="logo" alt="" hidden>
    <h1 class="big-word" id="short"></h1>
    <p class="course-name" id="name"></p>
    <p class="mono" id="code"></p>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main>
    <section id="now" class="now" aria-live="polite"><div class="state">กำลังโหลด…</div></section>
    <ol id="weeks" class="list"></ol>
  </main>

  <footer><span id="foot"></span><span class="mono" id="sub"></span></footer>
</div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
